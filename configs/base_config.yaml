# Base configuration for the "Predicting Relative Article Popularity" project.
# Override specific fields per experiment by copying this file
# (e.g. configs/exp01_frozen_head.yaml, configs/exp02_lora.yaml).

experiment_name: "baseline_run"
seed: 42

data:
  raw_csv: "data/raw/articles.csv"          # output of the Snowflake extraction query
  images_dir: "data/images/"                 # cached thumbnails (see src/data/download_images.py)
  processed_dir: "data/processed/"
  sites: ["mako", "n12"]
  target_column: "is_top_10_site_month"       # binary label, precomputed in SQL
  # Time-based split (NOT random) — train on earlier months, test on the most recent
  split:
    train_end_month: "2026-04"
    val_month: "2026-05"
    test_month: "2026-06"

model:
  # One of: "tfidf_lr" | "text_only_bert" | "image_only" | "siglip2_multimodal" | "hybrid_fallback"
  type: "siglip2_multimodal"
  siglip2:
    checkpoint: "google/siglip2-base-patch16-224"
    freeze_backbone: true          # Stage 1: classification head only
    unfreeze_last_n_layers: 0      # Stage 2: e.g. 2, 4 — set >0 to partially unfreeze
    use_lora: false                # Stage 3: set true to use LoRA instead of full unfreeze
    lora:
      r: 8
      alpha: 16
      dropout: 0.05
  hybrid_fallback:
    text_encoder: "onlplab/alephbert-base"
    image_encoder: "resnet50"       # or "efficientnet_b0"
    fusion_hidden_dim: 256

training:
  batch_size: 32
  learning_rate: 1.0e-4
  # Discriminative fine-tuning (Stage B/C): unfrozen backbone/LoRA params train
  # at learning_rate * backbone_lr_multiplier -- much lower than the head's LR,
  # since the backbone is pretrained and shouldn't move as fast as a randomly
  # initialized head. No effect in Stage A (no trainable backbone params).
  backbone_lr_multiplier: 0.1
  num_epochs: 10
  weight_decay: 0.01
  # Address ~10% positive class imbalance
  loss: "bce_with_class_weight"      # or "focal_loss"
  class_weight_positive: 9.0          # ~ (1 - 0.10) / 0.10
  early_stopping_patience: 3
  scheduler: "cosine"

evaluation:
  metrics: ["roc_auc", "pr_auc", "f1", "precision_at_k"]
  precision_at_k_values: [50, 100, 200]
  ablation:
    - name: "title_only"
      inputs: ["title"]
    - name: "title_tags"
      inputs: ["title", "tags"]
    - name: "image_only"
      inputs: ["image"]
    - name: "title_image"
      inputs: ["title", "image"]
    - name: "full_model"
      inputs: ["title", "tags", "image", "site"]

logging:
  output_dir: "experiments/"
  log_every_n_steps: 50
