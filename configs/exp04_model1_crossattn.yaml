# Model 1 of the "improvement phase" (see project_explanation_HE.md section
# 11): after Stages A/B/C (all naive concat fusion) failed to beat
# text_only_bert, this combines three changes at once:
#   1. Cross-attention fusion head instead of concat+MLP (model.siglip2.fusion)
#   2. Partial unfreeze (top 2 layers) + LoRA together, not either alone --
#      Stage B (full unfreeze, 57M params) overfit fast; Stage C (LoRA
#      alone) was stable but plateaued. This aims for a middle ground.
#   3. Full-resolution-only training data (data.processed_dir) -- filters
#      out the ~39% of rows whose thumbnail is a small CDN fallback tier
#      (82x62 or 232x175px), via src/data/filter_fullres.py. Fewer rows
#      (53,544 vs 87,334) but consistent image quality.

experiment_name: "siglip2_model1_crossattn_fullres"
seed: 42

data:
  raw_csv: "data/raw/articles.csv"
  images_dir: "data/images/"
  processed_dir: "data/processed/fullres"   # full-res-only, from filter_fullres.py
  sites: ["mako", "n12"]
  target_column: "is_top_10_site_month"
  split:
    train_end_month: "2026-04"
    val_month: "2026-05"
    test_month: "2026-06"

model:
  type: "siglip2_multimodal"
  siglip2:
    checkpoint: "google/siglip2-base-patch16-224"
    freeze_backbone: true
    unfreeze_last_n_layers: 2      # combined with LoRA below (see _apply_freeze_strategy)
    use_lora: true
    lora:
      r: 8
      alpha: 16
      dropout: 0.05
    fusion: "cross_attention"      # was "concat" in exp01-03
    fusion_dim: 512
    fusion_num_heads: 8
  hybrid_fallback:
    text_encoder: "onlplab/alephbert-base"
    image_encoder: "resnet50"
    fusion_hidden_dim: 256

training:
  batch_size: 32
  learning_rate: 1.0e-4
  backbone_lr_multiplier: 0.1
  num_epochs: 10
  weight_decay: 0.01
  loss: "bce_with_class_weight"
  class_weight_positive: 9.0
  early_stopping_patience: 3
  scheduler: "cosine"

evaluation:
  metrics: ["roc_auc", "pr_auc", "f1", "precision_at_k"]
  precision_at_k_values: [50, 100, 200]
  ablation:
    - name: "title_only"
      inputs: ["title"]
    - name: "title_tags"
      inputs: ["title", "tags"]
    - name: "image_only"
      inputs: ["image"]
    - name: "title_image"
      inputs: ["title", "image"]
    - name: "full_model"
      inputs: ["title", "tags", "image", "site"]

logging:
  output_dir: "experiments/"
  log_every_n_steps: 50
