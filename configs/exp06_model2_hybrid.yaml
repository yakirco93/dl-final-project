# Model 2 of the "improvement phase" (see project_explanation_HE.md section
# 11): the contingency plan from the original proposal, built now that three
# SigLIP2 strategies (frozen/unfreeze/LoRA) plus a cross-attention fusion
# upgrade all failed to beat text_only_bert (0.704/0.212). Different
# architecture entirely -- AlephBERT (Hebrew-specific text) + ResNet50
# (ImageNet-pretrained vision), fused by concat+MLP (src/models/
# hybrid_fallback.py). Full dataset (not the full-res-only filter -- that
# was Model 1's variable, kept out here to isolate the architecture change).
#
# Conservative unfreeze by default (Stage B's lesson: too many trainable
# params on ~87K rows overfits fast) -- 1 top BERT layer + ResNet's layer4.

experiment_name: "hybrid_model2_alephbert_resnet50"
seed: 42

data:
  raw_csv: "data/raw/articles.csv"
  images_dir: "data/images/"
  processed_dir: "data/processed"
  sites: ["mako", "n12"]
  target_column: "is_top_10_site_month"
  split:
    train_end_month: "2026-04"
    val_month: "2026-05"
    test_month: "2026-06"

model:
  type: "hybrid_fallback"
  siglip2:
    checkpoint: "google/siglip2-base-patch16-224"
    freeze_backbone: true
    unfreeze_last_n_layers: 0
    use_lora: false
    lora:
      r: 8
      alpha: 16
      dropout: 0.05
    fusion: "concat"
  hybrid_fallback:
    text_encoder: "onlplab/alephbert-base"
    image_encoder: "resnet50"
    fusion_hidden_dim: 256
    unfreeze_text_layers: 1     # top 1 of 12 BERT layers
    unfreeze_image_blocks: 1    # ResNet50's layer4 only (of layer1-4)

training:
  batch_size: 32
  learning_rate: 1.0e-4
  backbone_lr_multiplier: 0.1
  num_epochs: 10
  weight_decay: 0.01
  loss: "bce_with_class_weight"
  class_weight_positive: 9.0
  early_stopping_patience: 3
  scheduler: "cosine"

evaluation:
  metrics: ["roc_auc", "pr_auc", "f1", "precision_at_k"]
  precision_at_k_values: [50, 100, 200]
  ablation:
    - name: "title_only"
      inputs: ["title"]
    - name: "title_tags"
      inputs: ["title", "tags"]
    - name: "image_only"
      inputs: ["image"]
    - name: "title_image"
      inputs: ["title", "image"]
    - name: "full_model"
      inputs: ["title", "tags", "image", "site"]

logging:
  output_dir: "experiments/"
  log_every_n_steps: 50
